name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system zip
      run: |
        sudo apt-get update
        sudo apt-get install -y zip unzip

    - name: Run unit tests
      run: |
        python -m unittest discover tests
